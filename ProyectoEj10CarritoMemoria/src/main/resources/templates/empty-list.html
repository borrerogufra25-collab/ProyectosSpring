<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sin resultados</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>

<body class="bg-light">

	<div class="container d-flex flex-column justify-content-center align-items-center min-vh-100 text-center">
		<div class="card p-5 shadow-lg border-0 bg-white" style="max-width: 500px;">
			<div class="text-warning mb-4">
				<i class="bi bi-exclamation-triangle-fill" style="font-size: 4rem;"></i>
			</div>
			<h2 class="mb-3 text-dark fw-bold">Ups, algo ha ocurrido</h2>

			<p class="text-muted mb-4 fs-5" th:text="${message}">No se han encontrado elementos con los criterios
				definidos.</p>

			<div class="d-grid gap-2">
				<a th:href="@{/}" class="btn btn-primary py-2 fw-semibold">
					<i class="bi bi-house-door me-2"></i>Volver al Inicio
				</a>
			</div>
		</div>
	</div>

</body>

</html>
