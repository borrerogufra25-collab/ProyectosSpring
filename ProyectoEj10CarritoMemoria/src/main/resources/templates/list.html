<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-center navbar-brand fw-bold" href="#" th:href="@{/}">
                <i class="bi bi-shop me-2"></i>Mi Tienda
            </a>
            <div class="ms-auto d-flex align-items-center">
                <form class="d-flex me-3" th:action="@{/list}" method="get">
                    <input class="form-control form-control-sm me-2" type="search" name="search" placeholder="No desarrollado..." aria-label="Buscar">
                    <button class="btn btn-outline-light btn-sm" type="submit"><i class="bi bi-search"></i></button>
                </form>
                
                <a th:href="@{/carrito}" class="btn btn-primary position-relative btn-sm">
                    <i class="bi bi-cart4 me-1"></i> Carrito
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                          th:if="${total_carrito > 0}" 
                          th:text="${#numbers.formatCurrency(total_carrito)}">
                        0,00 €
                    </span>
                </a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h1 class="mb-4 text-secondary border-bottom pb-2">Nuestro Catálogo</h1>
        
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
            
            <div class="col" th:each="producto : ${productos}">
                <div class="card product-card position-relative shadow-sm">
                    
                    <span class="badge bg-danger discount-badge fs-6" th:if="${producto.tieneDescuento()}" 
                          th:text="${'-' + #numbers.formatPercent(producto.descuento, 1, 0)}">-20%</span>
                    
                    <div class="product-img-container">
                        <img th:src="${producto.imagen != null ? producto.imagen : 'https://via.placeholder.com/300'}" 
                             class="card-img-top" th:alt="${producto.nombre}">
                    </div>
                    
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title text-truncate" th:text="${producto.nombre}">Producto</h5>
                        <p class="card-text text-muted small flex-grow-1" th:text="${producto.descripcion}">Descripción corta...</p>
                        
                        <div class="my-3">
                            <div th:if="${producto.tieneDescuento()}">
                                <span class="text-decoration-line-through text-muted small" th:text="${#numbers.formatCurrency(producto.pvp)}">0.0 €</span>
                                <span class="text-danger fw-bold fs-5 ms-2" th:text="${#numbers.formatCurrency(producto.getPrecioFinal())}">0.0 €</span>
                            </div>
                            <div th:unless="${producto.tieneDescuento()}">
                                <span class="text-dark fw-bold fs-5" th:text="${#numbers.formatCurrency(producto.pvp)}">0.0 €</span>
                            </div>
                        </div>
                        
                        <a th:href="@{/productoACarrito/{id}(id=${producto.id})}" class="btn btn-outline-success w-100 mt-auto">
                            <i class="bi bi-cart-plus-fill me-1"></i> Añadir al carrito
                        </a>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <footer class="bg-dark text-light py-3 mt-auto text-center small text-muted">
        <div class="container">
            &copy; 2026 Proyectos DAM - Carrito en Memoria.
        </div>
    </footer>

</body>
</html>
