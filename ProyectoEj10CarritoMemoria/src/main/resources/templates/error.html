<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error en la aplicación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100 text-center">
        <div class="card p-5 shadow-lg border-0 bg-white" style="max-width: 600px;">
            
            <div class="text-danger mb-4">
                <i class="bi bi-bug-fill" style="font-size: 4.5rem;"></i>
            </div>
            
            <h1 class="h3 fw-bold text-dark mb-2">Oops... something went wrong</h1>
            <p class="text-muted small italic mb-4">¿Habrán sido los ñus? 🦌</p>
            
            <div class="alert alert-danger py-3 border-0 shadow-sm rounded-3 mb-4">
                <h4 class="alert-heading fw-bold mb-1" th:text="${status != null ? status : 'Error'} + ' ' + ${error != null ? error : ''}">
                    500 Internal Server Error
                </h4>
                <p class="mb-0 small opacity-75" th:if="${message}" th:text="${message}">
                    Detalles específicos del error generado por el sistema.
                </p>
            </div>
            
            <p class="text-start text-muted x-small bg-light p-2 rounded border border-secondary-subtle" th:if="${path}">
                <i class="bi bi-link-45deg me-1"></i><strong class="small text-secondary">Ruta:</strong> 
                <span class="font-monospace text-break" th:text="${path}">/ruta-del-error</span>
            </p>

            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center mt-3">
                <a th:href="@{/}" class="btn btn-primary px-4 py-2 fw-semibold shadow-sm">
                    <i class="bi bi-house-door me-2"></i>Volver al Inicio
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2 fw-semibold">
                    <i class="bi bi-arrow-left me-2"></i>Regresar
                </a>
            </div>
        </div>
    </div>

</body>
</html>
