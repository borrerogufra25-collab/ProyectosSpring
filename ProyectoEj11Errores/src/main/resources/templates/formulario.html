<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Curso</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Crear Nuevo Curso</h3>
        </div>
        <div class="card-body">
            
            <form th:action="@{/nuevo/guardar}" th:object="${curso}" method="POST">
                
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre del Curso</label>
                    <input type="text" id="nombre" th:field="*{nombre}" 
                           th:errorclass="is-invalid" class="form-control" placeholder="Ej: Introducción a JPA">
                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                </div>

                <div class="mb-3">
                    <label for="tutor" class="form-label">Tutor / Profesor</label>
                    <input type="text" id="tutor" th:field="*{tutor}" 
                           th:errorclass="is-invalid" class="form-control" placeholder="Nombre del docente">
                    <div class="invalid-feedback" th:errors="*{tutor}"></div>
                </div>

                <div class="mb-3">
                    <label for="plazasMaximas" class="form-label">Número Máximo de Plazas</label>
                    <input type="number" id="plazasMaximas" th:field="*{plazasMaximas}" 
                           th:errorclass="is-invalid" class="form-control">
                    <div class="invalid-feedback" th:errors="*{plazasMaximas}"></div>
                    <small class="text-muted">Por normativa local, máximo 50 plazas por curso.</small>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar Curso</button>
                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>
