<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Academia Salesianos Triana</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/style.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

	<div class="container mt-5">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1 class="text-primary">Gestión de Cursos - Salesianos Triana</h1>
			<a th:href="@{/nuevo}" class="btn btn-success">+ Añadir Nuevo Curso</a>
		</div>

		<div class="card shadow-sm">
			<div class="card-body p-0">
				<table class="table table-hover table-striped mb-0">
					<thead class="table-dark">
						<tr>
							<th>ID</th>
							<th>Nombre del Curso</th>
							<th>Profesor / Tutor</th>
							<th>Plazas Disponibles</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="c : ${cursos}">
							<td th:text="${c.id}">1</td>
							<td th:text="${c.nombre}" class="fw-bold">Java Profesional</td>
							<td th:text="${c.tutor}">Manuel Antúnez</td>
							<td>
								<span th:text="${c.plazasOcupadas} + ' / ' + ${c.plazasMaximas}">0 / 25</span>
								<span th:if="${c.plazasOcupadas >= c.plazasMaximas}"
									class="badge bg-danger ms-2">COMPLETO</span>
							</td>
							<td>
								<a th:href="@{/matricular/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary">
									Matricular Alumno
								</a>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(cursos)}">
							<td colspan="5" class="text-center text-muted py-4">No hay cursos registrados todavía.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

</body>

</html>
