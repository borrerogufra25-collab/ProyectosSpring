<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-Link | Alerta del Sistema</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 text-center">
                
                <div class="card card-dashboard p-5 rounded-4 shadow border border-danger border-opacity-50">
                    
                    <div class="text-danger mb-4">
                        <i class="bi bi-exclamation-octagon-fill display-1 animate__animated animate__pulse animate__infinite"></i>
                    </div>

                    <h1 class="h2 fw-bold text-danger text-uppercase tracking-wide mb-3" 
                        th:text="${codigoError}">
                        500 - FALLO DE CONEXIÓN
                    </h1>
                    
                    <hr class="border-secondary opacity-25 my-4">
                    
                    <p class="fs-5 text-secondary px-3 mb-4" 
                       th:text="${mensajeError}">
                        Ha ocurrido una anomalía inesperada en el flujo de datos biometrométricos.
                    </p>
                    
                    <div class="d-grid gap-2 col-9 mx-auto mt-2">
                        <a th:href="@{/}" class="btn btn-outline-info">
                            <i class="bi bi-arrow-counterclockwise me-2"></i>Reiniciar Enlace (Inicio)
                        </a>
                        <a href="javascript:history.back()" class="btn btn-sm btn-link text-secondary text-decoration-none mt-2">
                            <i class="bi bi-chevron-left me-1"></i>Volver a la pantalla anterior
                        </a>
                    </div>

                </div>

                <p class="small text-secondary text-opacity-50 mt-4">
                    Código de diagnóstico interno. Servidor Central de Quirófanos.
                </p>

            </div>
        </div>
    </div>

</body>
</html>
