<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-Link | Formulario de Cirujano</title>
    <link class="ui" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="/">
                <i class="bi bi-cpu-fill me-2"></i>NEURO-LINK LABS
            </a>
        </div>
    </nav>

    <main class="container" style="max-width: 600px;">
        <div class="card card-dashboard p-4 rounded-4 shadow">
            <h2 class="h3 fw-bold text-warning mb-2" th:text="${cirujano.id == null} ? 'Credenciales de Especialista' : 'Actualizar Credenciales'">Credenciales de Especialista</h2>
            <p class="text-secondary small mb-4">Establezca los campos de especialidad técnica y nivel de autorización operativa.</p>
            <hr class="border-secondary opacity-25 mb-4">

            <form th:action="@{/cirujanos/nuevo/submit}" th:object="${cirujano}" method="POST">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="nombre" class="form-label text-secondary fw-semibold">Nombre Completo</label>
                    <input type="text" class="form-control bg-dark border-secondary text-white focus-ring focus-ring-warning" 
                           id="nombre" th:field="*{nombre}" placeholder="Ej. Dr. Victor Vector" required>
                </div>

                <div class="mb-3">
                    <label for="especialidad" class="form-label text-secondary fw-semibold">Campo de Especialización</label>
                    <input type="text" class="form-control bg-dark border-secondary text-white focus-ring focus-ring-warning" 
                           id="especialidad" th:field="*{especialidad}" placeholder="Ej. Ciber-óptica aplicada" required>
                </div>

                <div class="mb-4">
                    <label for="rango" class="form-label text-secondary fw-semibold">Nivel/Rango Corporativo</label>
                    <select class="form-select bg-dark border-secondary text-white focus-ring focus-ring-warning" id="rango" th:field="*{rango}" required>
                        <option value="Junior">Técnico de Quirófano (Junior)</option>
                        <option value="Senior">Especialista Senior</option>
                        <option value="Master">Director Operativo (Master)</option>
                    </select>
                </div>

                <div class="d-flex gap-2 justify-content-end">
                    <a th:href="@{/cirujanos}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-warning text-dark fw-semibold px-4">
                        <i class="bi bi-shield-check-fill me-2"></i>Registrar Autorización
                    </button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
