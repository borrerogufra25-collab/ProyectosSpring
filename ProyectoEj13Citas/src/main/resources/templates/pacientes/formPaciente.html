<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-Link | Formulario de Paciente</title>
    <link class="ui" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="/">
                <i class="bi bi-cpu-fill me-2"></i>NEURO-LINK LABS
            </a>
        </div>
    </nav>

    <main class="container" style="max-width: 600px;">
        <div class="card card-dashboard p-4 rounded-4 shadow">
            <h2 class="h3 fw-bold text-primary mb-2" th:text="${paciente.id == null} ? 'Alta de Sujeto' : 'Modificar Perfil'">Alta de Sujeto</h2>
            <p class="text-secondary small mb-4">Introduzca los parámetros de identidad obligatorios para abrir el expediente bio-digital.</p>
            <hr class="border-secondary opacity-25 mb-4">

            <form th:action="@{/pacientes/nuevo/submit}" th:object="${paciente}" method="POST">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="nombre" class="form-label text-secondary fw-semibold">Nombre Completo</label>
                    <input type="text" class="form-control bg-dark border-secondary text-white focus-ring focus-ring-primary" 
                           id="nombre" th:field="*{nombre}" placeholder="Ej. Valerie Palmer" required>
                </div>

                <div class="mb-3">
                    <label for="alias" class="form-label text-secondary fw-semibold">Alias Operativo</label>
                    <input type="text" class="form-control bg-dark border-secondary text-white focus-ring focus-ring-primary" 
                           id="alias" th:field="*{alias}" placeholder="Ej. V" required>
                </div>

                <div class="mb-4">
                    <label for="email" class="form-label text-secondary fw-semibold">Enlace de Comunicación (Email)</label>
                    <input type="email" class="form-control bg-dark border-secondary text-white focus-ring focus-ring-primary" 
                           id="email" th:field="*{email}" placeholder="valerie@cybernet.org" required>
                </div>

                <div class="d-flex gap-2 justify-content-end">
                    <a th:href="@{/pacientes}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-database-fill-check me-2"></i>Guardar Expediente
                    </button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
