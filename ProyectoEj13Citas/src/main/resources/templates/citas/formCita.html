<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-Link | Programar Intervención</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="/">
                <i class="bi bi-cpu-fill me-2"></i>NEURO-LINK LABS
            </a>
        </div>
    </nav>

    <main class="container" style="max-width: 650px;">
        <div class="card card-dashboard p-4 rounded-4 shadow">
            <h2 class="h3 fw-bold text-info mb-2">Programar Cita Quirúrgica</h2>
            <p class="text-secondary small mb-4">Reserve un bloque de tiempo de 2 horas. El sistema validará automáticamente la disponibilidad del especialista.</p>
            <hr class="border-secondary opacity-25 mb-4">

            <form th:action="@{/citas/nuevo/submit}" th:object="${cita}" method="POST">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="paciente" class="form-label text-secondary fw-semibold">Sujeto / Paciente</label>
                    <select class="form-select bg-dark border-secondary text-white focus-ring focus-ring-info" id="paciente" th:field="*{paciente.id}" required>
                        <option value="" hidden selected>-- Seleccione el receptor del implante --</option>
                        <option th:each="p : ${pacientes}" th:value="${p.id}" th:text="${p.nombre + ' (' + p.alias + ')'}">Nombre (Alias)</option>
                    </select>
                </div>

				<div class="mb-3">
				    <label for="cirujano" class="form-label text-secondary fw-semibold">Especialista Responsable</label>
				    
				    <select class="form-select bg-dark border-secondary text-white focus-ring focus-ring-info" 
				            id="cirujano" 
				            th:field="*{cirujano.id}" 
				            th:classappend="${#fields.hasErrors('cirujano')} ? 'is-invalid' : ''" required>
				        <option value="" hidden selected>-- Asigne un Cirujano libre --</option>
				        <option th:each="c : ${cirujanos}" th:value="${c.id}" th:text="${c.nombre + ' [' + c.especialidad + ']'}">Dr. Nombre [Especialidad]</option>
				    </select>
				    
				    <div class="invalid-feedback fw-semibold text-danger mt-2" 
				         th:if="${#fields.hasErrors('cirujano')}" 
				         th:errors="*{cirujano}">
				        Mensaje de error por defecto (se cambiará dinámicamente).
				    </div>
				</div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="fechaHora" class="form-label text-secondary fw-semibold">Fecha y Hora de Enlace</label>
                        <input type="datetime-local" class="form-control bg-dark border-secondary text-white focus-ring focus-ring-info" 
                               id="fechaHora" th:field="*{fechaHora}" required>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label for="salaQuirofano" class="form-label text-secondary fw-semibold">Módulo de Quirófano</label>
                        <input type="text" class="form-control bg-dark border-secondary text-white focus-ring focus-ring-info" 
                               id="salaQuirofano" th:field="*{salaQuirofano}" placeholder="Ej. Quirófano Gamma-9" required>
                    </div>
                </div>

                <div class="d-flex gap-2 justify-content-end mt-2">
                    <a th:href="@{/citas}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-info text-dark fw-bold px-4">
                        <i class="bi bi-calendar-plus-fill me-2"></i>Validar y Reservar Cita
                    </button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
